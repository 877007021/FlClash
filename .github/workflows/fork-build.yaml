name: fork-build

# Builds Android APK and Windows packages for this private fork.
#
# Why this workflow exists instead of reusing build.yaml:
#   build.yaml's `build` job is pinned to the upstream repository
#     (if: github.repository == 'chen08209/FlClash' && ... tag push)
#   and its `upload` job needs upstream-only secrets (Telegram bot, Homebrew
#   tap deploy key, F-Droid deploy key). In a fork that job never runs and the
#   upload would fail, so the fork carries its own minimal build here.
#
# The upstream `dart` / `go` / `android` check jobs stay in build.yaml as a
# quality signal; they are not a gate for these artifacts.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target'
        type: choice
        options:
          - all
          - android
          - windows
        default: all
      publish:
        description: 'Publish the artifacts to a GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (blank = v<version>-build<run number>)'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  # Added to the pubspec's own build number (not replacing it): the checked-in
  # value is already large, so a plain run number would be a versionCode
  # downgrade and Android refuses to install over the previous build.
  VERSION_BUMP: ${{ github.run_number }}

jobs:
  android:
    name: Android APK
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Falls back to the default token for public submodules.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore dev keystore
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.android_signing }}
        id: devkeystore
        uses: actions/cache/restore@v4
        with:
          # A dev signature must stay the same across runs or Android treats
          # every build as a different app and refuses to upgrade in place.
          path: android/app/keystore.jks
          key: flclash-fork-dev-keystore-v1

      - name: Setup Android signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=android/app/keystore.jks
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            # The repository keystore is the release identity: an APK signed by
            # anything else cannot upgrade a build published under it, so it
            # wins whenever the secrets exist.
            echo "Signing with the repository keystore secrets."
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
            alias="${KEY_ALIAS:?ANDROID_KEY_ALIAS secret is missing}"
            store="${STORE_PASSWORD:?ANDROID_STORE_PASSWORD secret is missing}"
            key="${KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is missing}"
            echo 'source=repository' >> "$GITHUB_OUTPUT"
          else
            if [[ -s "$keystore" ]]; then
              echo "Reusing the cached dev keystore."
            else
              echo "No keystore yet; generating a dev keystore."
              keytool -genkeypair -noprompt \
                -keystore "$keystore" \
                -alias flclash-dev \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass flclash-dev -keypass flclash-dev \
                -dname "CN=FlClash Fork Dev, OU=Dev, O=Dev, L=NA, ST=NA, C=CN"
            fi
            # A dev signature is not a distributable identity: it is stable
            # enough to upgrade in place, not to publish.
            alias=flclash-dev
            store=flclash-dev
            key=flclash-dev
            echo 'source=dev' >> "$GITHUB_OUTPUT"
          fi
          {
            echo "storePassword=$store"
            echo "keyAlias=$alias"
            echo "keyPassword=$key"
          } >> android/local.properties
          test -s android/local.properties
          test -s "$keystore"

      - name: Save dev keystore
        # Only the generated dev key may enter the cache; a run that unpacked
        # the repository keystore must not write the release private key into
        # a cache entry that any branch of this repository can restore.
        if: ${{ steps.signing.outputs.source == 'dev' && steps.devkeystore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: android/app/keystore.jks
          key: flclash-fork-dev-keystore-v1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Stamp build number
        run: python3 tool/ci_bump_build.py

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots
      # loads it for Dart. Pinned by hash, so a new bundle is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-artifact-android
          path: ./dist
          overwrite: true
          if-no-files-found: error

  windows:
    name: Windows amd64
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          # The exe target shells out to ISCC.exe. The runner image ships
          # Inno Setup 6, but the workflow pins it so a runner image bump
          # cannot silently drop the tool the packaging step needs.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          & $iscc /? | Select-Object -First 1
          Write-Output "Inno Setup ready: $iscc"

      - name: Stamp build number
        run: python tool/ci_bump_build.py

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256 *$bundle" | sha256sum -c -

      - name: Build
        run: dart setup.dart windows --env stable -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-artifact-windows-amd64
          path: ./dist
          overwrite: true
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, windows]
    # A partial matrix must not publish a release missing a platform, so the
    # job runs only when both builds ran and succeeded.
    if: >-
      !cancelled() &&
      needs.android.result == 'success' &&
      needs.windows.result == 'success' &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: fork-artifact-*
          merge-multiple: true

      - name: Name the release
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            # A tag push already carries the version; a manual run has none, so
            # it gets a per-run tag that sorts by build number.
            tag="${PUSH_TAG:-}"
            if [[ ! "$tag" =~ ^v[0-9] ]]; then
              version="$(sed -n 's/^version: *\([0-9][^+]*\).*/\1/p' pubspec.yaml | head -1)"
              tag="v${version:-0.0.0}-build${{ github.run_number }}"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ./dist/*
          fail_on_unmatched_files: true
          body: |
            Automated build from `${{ github.sha }}`.

            | Platform | File |
            | --- | --- |
            | Android (arm64-v8a) | `FlClash-*-android-arm64-v8a.apk` |
            | Android (armeabi-v7a) | `FlClash-*-android-armeabi-v7a.apk` |
            | Android (x86_64) | `FlClash-*-android-x86_64.apk` |
            | Windows amd64 | `FlClash-*-windows-amd64-setup.exe` / `-windows-amd64.zip` |

            APKs are signed with the repository release keystore, so they upgrade
            in place over earlier builds published here. `SHA256SUMS` covers every
            file in this release.
